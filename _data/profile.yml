short_bio: >-
  <p>
    I am entering my first year of graduate study at Wayne State University,
    where I will be continuing to study neutron star X-ray binaries through observations with observatories such as NuSTAR and XRISM.
    Prior to beginning my PhD program, I have been at Middlebury College in Vermont for five years:
    four as an undergraduate and one more as a post-baccalaureate research assistant.
  </p>
  <p>
    At Middlebury College I primarily studied high mass X-ray binaries using NuSTAR's stray light,
    as well as higher resolution spectra from XMM-Newton and XRISM.
    During my post-baccalaureate appointment, I also had the opportunity to build my computational skills and study accretion dynamics in star formation.
  </p>
  <p>
    Beyond my research, I am also involved in a variety of outreach and community engagement activities to share physics and astronomy with larger communities.
  </p>

